<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTV Calendar</title>
<style>

:root{
  --bg:#f7f6f4;
  --panel:#ffffff;
  --grid:#d6d2cc;
  --text:#111111;
  --muted:#787470;
  --global:#d4d4d4;
  --nea:#4a8eb5;
  --sea:#c43030;
  --china:#c47800;
  --restocks:#7a5a35;
  --events:#edecea;
  --wkA:#ffffff;
  --wkB:#f3f2f0;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
}

.app{
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
}

/* ── Toolbar ─────────────────────────────────────────────────────────────── */
.toolbar{
  flex-shrink:0;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  background:rgba(246,241,232,.97);
  backdrop-filter:blur(8px);
  border:1px solid var(--grid);
  border-radius:14px;
  padding:10px 14px;
  margin:10px 12px 8px;
}
.toolbar-title{
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
  color:#3a3530;
}
.view-only-badge{
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  background:#f0ede7;
  border:1px solid #c5bfb5;
  color:#787470;
  padding:3px 9px;
  border-radius:999px;
}
.yr-tabs{display:flex;gap:4px;margin-left:auto}
.yr-tab{
  padding:4px 14px;border:1px solid var(--grid);border-radius:20px;
  font-family:inherit;font-size:12px;font-weight:700;background:#fff;
  color:#888;cursor:pointer;letter-spacing:.04em;
  transition:background .12s,color .12s,border-color .12s;
}
.yr-tab.active{background:#3a3530;color:#fff;border-color:#3a3530}
.yr-tab:hover:not(.active){background:#f4f2ef}
.refresh-btn{
  padding:4px 12px;border:1px solid var(--grid);border-radius:8px;
  font-family:inherit;font-size:12px;font-weight:600;
  background:#fff;color:#555;cursor:pointer;
}
.refresh-btn:hover{background:#f4f2ef}

/* ── Table container ─────────────────────────────────────────────────────── */
.table-outer{
  flex:1;
  min-height:0;
  overflow:auto;
  margin:0 12px 12px;
  border:1px solid var(--grid);
  border-radius:16px;
  background:var(--panel);
}

table{
  border-collapse:separate;
  border-spacing:0;
  min-width:100%;
  width:max-content;
}
th,td{
  border-right:1px solid var(--grid);
  border-bottom:1px solid var(--grid);
  vertical-align:top;
}
thead th{
  background:#e8e2d8;
  text-align:center;
  padding:8px 6px;
  font-weight:600;
  position:sticky;
  z-index:4;
}
thead tr:nth-child(1) th{top:0}
thead tr:nth-child(2) th{top:36px}
thead tr:nth-child(3) th{top:72px}
thead tr:nth-child(4) th{top:108px}

.corner{
  position:sticky;left:0;z-index:6;
  background:#e8e2d8;text-align:left;
  width:138px;min-width:138px;max-width:138px;
  padding:8px 10px;white-space:nowrap;
}
thead .corner{z-index:8}

.rowhead{
  position:sticky;left:0;z-index:5;
  width:138px;min-width:138px;max-width:138px;
  padding:12px;font-weight:600;
  white-space:normal;word-break:break-word;
  text-align:left;font-size:18px;line-height:1.15;color:#fff;
}
.bg-global{background:var(--global);color:#2d2d2d}
.bg-nea{background:var(--nea)}
.bg-sea{background:var(--sea)}
.bg-china{background:var(--china)}
.bg-restocks{background:var(--restocks)}
.bg-events{background:var(--events);color:#2d2d2d}

.wk{
  width:196px;min-width:196px;
  padding:6px;text-align:center;background:var(--wkA);
}
.wk.alt{background:var(--wkB)}

.cell{
  min-height:120px;display:flex;flex-direction:column;gap:8px;align-items:stretch;
}

/* ── Entry card ──────────────────────────────────────────────────────────── */
.entry{
  background:#fffdfa;border:1px solid var(--grid);
  border-radius:18px;padding:12px;text-align:left;
  position:relative;transition:box-shadow .15s,transform .15s;
}
.entry:hover{
  z-index:15;box-shadow:0 10px 28px rgba(0,0,0,.16);transform:translateY(-1px);
}
.entry.delay{background:#DB6256;border-color:#b03020}
.entry.delay .entry-title,.entry.delay .entry-date,.entry.delay .cat,
.entry.delay .prod-name,.entry.delay .prod-price,.entry.delay .prod-meta,
.entry.delay .label,.entry.delay .muted{color:#111!important}

.entry-preview{overflow:hidden}
.entry:hover .entry-preview{overflow:visible}

.title-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.title-left{display:flex;gap:10px;align-items:flex-start;min-width:0}

.dot{width:14px;height:14px;border-radius:50%;margin-top:6px;border:1px solid rgba(0,0,0,.15);flex:0 0 auto}
.dot.high{background:#c92323}
.dot.medium{background:#f2a114}
.dot.low{background:#f2d148}
.dot.brand{background:#b8a689}

.entry-title{font-weight:600;line-height:1.15;font-size:13px;white-space:normal;word-break:break-word;overflow:hidden}
.entry-date{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px;line-height:1.05}

.live-badge{
  display:inline-block;flex-shrink:0;margin-top:2px;
  font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:#2a6e2a;color:#fff;padding:2px 8px;border-radius:6px;white-space:nowrap;
}

.group{display:grid;grid-template-columns:64px 1fr;gap:12px;margin-top:10px}
.cat{font-weight:600;font-size:10px}

.prod{margin-bottom:10px}
.prod-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prod-name{font-weight:600;min-width:0;flex:1 1 auto;line-height:1.15;font-size:12px;white-space:normal;word-break:break-word;overflow:hidden}
.prod-price{white-space:nowrap;font-weight:600;flex:0 0 auto;font-size:12px}
.prod-meta{white-space:pre-line;margin-top:2px;line-height:1.08;font-size:12px}

.label{font-weight:600;font-size:12px}
.muted{color:var(--muted)}
.entry-info{font-size:12px;margin-top:4px;line-height:1.3}

/* ── Status / empty ─────────────────────────────────────────────────────── */
.msg-cell{padding:40px 20px;text-align:center;color:#aaa;font-size:13px}
.empty-section td{background:#fafaf9}

</style>
</head>
<body>

<div class="app">

  <div class="toolbar">
    <span class="toolbar-title">BTV Calendar</span>
    <span class="view-only-badge">View Only</span>
    <div class="yr-tabs">
      <button class="yr-tab active" id="yr2026" onclick="setYear(2026)">2026</button>
      <button class="yr-tab"        id="yr2027" onclick="setYear(2027)">2027</button>
    </div>
    <button class="refresh-btn" onclick="loadCalendar()">&#8635; Refresh</button>
  </div>

  <div class="table-outer">
    <table id="calTable">
      <tbody><tr><td class="msg-cell">Loading&hellip;</td></tr></tbody>
    </table>
  </div>

</div>

<script>
var _year   = 2026;
var _sb     = null;
var _loaded = false;

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var SECTIONS = [
  {key:'global',         label:'Global',               cls:'bg-global'},
  {key:'china',          label:'China',                cls:'bg-china'},
  {key:'sea',            label:'SEA',                  cls:'bg-sea'},
  {key:'nea',            label:'NEA',                  cls:'bg-nea'},
  {key:'restocks',       label:'Restocks',             cls:'bg-restocks'},
  {key:'events',         label:'Events / Activations', cls:'bg-events'},
  {key:'store_openings', label:'Store Openings',       cls:'bg-global'},
];

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDDMMM(v){
  if(!v) return '';
  var d = new Date(v+'T00:00:00');
  if(isNaN(d.getTime())) return v;
  return String(d.getDate()).padStart(2,'0')+'-'+MONTHS[d.getMonth()];
}

function dayName(v){
  if(!v) return '';
  var d = new Date(v+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-US',{weekday:'short'});
}

function weekRangeLabel(a,b){
  return String(a.getDate()).padStart(2,'0')+'-'+MONTHS[a.getMonth()]+
    ' to '+String(b.getDate()).padStart(2,'0')+'-'+MONTHS[b.getMonth()];
}

function mondayOnOrBefore(date){
  var d = new Date(date); var day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d;
}

function addDays(date,n){
  var d = new Date(date); d.setDate(d.getDate()+n); return d;
}

function buildWeeks(yr){
  var start = new Date(yr+'-01-01T00:00:00');
  var end   = new Date(yr+'-12-31T00:00:00');
  var cur   = mondayOnOrBefore(start);
  var out   = [];
  while(cur <= end){
    var wkEnd  = addDays(cur,6);
    var anchor = addDays(cur,3);
    if(wkEnd>=start && cur<=end){
      out.push({
        id:    cur.toISOString().slice(0,10),
        start: new Date(cur),
        end:   new Date(wkEnd),
        month: MONTHS[anchor.getMonth()],
        quarter: 'Q'+(Math.floor(anchor.getMonth()/3)+1)
      });
    }
    cur = addDays(cur,7);
  }
  out.forEach(function(w,i){ w.weekOfYear = i+1; });
  return out;
}

// ── Entry renderers (read-only) ───────────────────────────────────────────────

function dotCls(entry){
  var k = entry.keyLevel||'brand';
  return {high:'high',medium:'medium',low:'low',brand:'brand'}[k]||'brand';
}

function liveBadge(){
  return '<span class="live-badge">&#10003; Live</span>';
}

function renderGlobal(e){
  var grouped = {};
  (e.lines||[]).forEach(function(l){
    if(!(l.category||l.productName||l.colour||l.size||l.price)) return;
    var c = l.category||'';
    if(!grouped[c]) grouped[c]=[];
    grouped[c].push(l);
  });
  var groups = Object.keys(grouped).map(function(cat){
    return '<div class="group"><div class="cat">'+esc(cat)+'</div><div>'+
      grouped[cat].map(function(l){
        return '<div class="prod"><div class="prod-top">'+
          '<div class="prod-name">'+esc(l.productName||'')+'</div>'+
          '<div class="prod-price">'+(l.price?'$'+esc(l.price):'')+'</div>'+
          '</div><div class="prod-meta">'+esc(l.colour||'')+'</div></div>';
      }).join('')+
    '</div></div>';
  }).join('');
  var delay = (e.launchStatus==='delay'&&(e.delayMarkets||[]).length)
    ? '<div class="entry-info"><span class="label">Delay Mkt:</span> '+
      (e.delayMarkets||[]).map(function(x){return esc(x.market)+' '+fmtDDMMM(x.eta);}).join(', ')+'</div>'
    : '';
  var mkts = (e.noLaunchMarkets||[]).length ? esc((e.noLaunchMarkets).join(', ')) : '—';
  return '<div class="entry'+(e.launchStatus==='delay'?' delay':'')+'">'+
    '<div class="entry-preview">'+
    '<div class="title-row">'+
      '<div class="title-left">'+
        '<div class="dot '+dotCls(e)+'"></div>'+
        '<div>'+
          '<div class="entry-date">'+fmtDDMMM(e.launchDate)+(e.launchDate?' ('+dayName(e.launchDate)+')':'')+'</div>'+
          '<div class="entry-title">'+esc(e.launchTitle||'')+'</div>'+
        '</div>'+
      '</div>'+
      liveBadge()+
    '</div>'+
    groups+
    '<div class="entry-info"><span class="label">No. of SKUs:</span> '+esc(e.skuCount||0)+'</div>'+
    '<div class="entry-info"><span class="label">Launch (Mkt):</span> '+mkts+'</div>'+
    delay+
    '</div></div>';
}

function renderRegional(e){
  var displayDate = e.launchDate||e.startDateISO||'';
  var dateStr = displayDate ? fmtDDMMM(displayDate)+' ('+dayName(displayDate)+')' : (e.startDate||'');
  var displayTitle = e.launchTitle||e.optionType||'';
  var marketStr = (e.allMarkets||false) ? 'All' : esc((e.countries||[]).join(', ')||'—');
  var colour = e.colour||(e.colorSize&&!e.colorSize.includes(' / ')?e.colorSize:(e.colorSize||'').split(' / ')[0])||'';
  return '<div class="entry">'+
    '<div class="entry-preview">'+
    '<div class="title-row">'+
      '<div class="title-left">'+
        '<div class="dot '+dotCls(e)+'"></div>'+
        '<div>'+
          '<div class="entry-date">'+dateStr+'</div>'+
          '<div class="entry-title">'+esc(displayTitle)+'</div>'+
        '</div>'+
      '</div>'+
      liveBadge()+
    '</div>'+
    '<div class="group"><div class="cat">'+esc(e.optionType||'')+'</div>'+
    '<div><div class="prod"><div class="prod-top">'+
      '<div class="prod-name">'+esc(e.productTitle||'—')+'</div>'+
      '<div class="prod-price">'+(e.price?'$'+esc(e.price):'')+'</div>'+
    '</div><div class="prod-meta">'+esc(colour)+'</div></div></div></div>'+
    '<div class="entry-info"><span class="label">Markets:</span> '+marketStr+'</div>'+
    '</div></div>';
}

function renderRestock(e){
  var displayDate = e.etaISO||'';
  var dateStr = displayDate ? 'ETA '+fmtDDMMM(displayDate)+' ('+dayName(displayDate)+')' : (e.eta?'ETA '+e.eta:'');
  var lines = (e.lines&&e.lines.length) ? e.lines : [{productTitle:e.productTitle||'',colour:'',colors:e.colors||''}];
  var displayTitle = lines.length>1
    ? lines.map(function(l){return l.productTitle;}).filter(Boolean).join(', ')
    : (lines[0].productTitle||e.productTitle||'');
  var marketStr = (e.allMarkets||false) ? 'All Markets' : esc((e.markets||[]).join(', ')||'—');
  var lineHTML = lines.filter(function(l){return l.productTitle||l.colour||l.colors;}).map(function(l){
    var col = l.colour||(l.colors&&!l.colors.includes(' / ')?l.colors:(l.colors||'').split(' / ')[0])||'';
    return '<div class="prod"><div class="prod-top"><div class="prod-name">'+esc(l.productTitle||'—')+'</div></div>'+
      '<div class="prod-meta">'+esc(col)+'</div></div>';
  }).join('');
  return '<div class="entry">'+
    '<div class="entry-preview">'+
    '<div class="title-row">'+
      '<div class="title-left">'+
        '<div class="dot '+dotCls(e)+'"></div>'+
        '<div>'+
          '<div class="entry-date">'+dateStr+'</div>'+
          '<div class="entry-title">'+esc(displayTitle)+'</div>'+
        '</div>'+
      '</div>'+
      liveBadge()+
    '</div>'+
    '<div class="group"><div class="cat">Restock</div><div>'+lineHTML+'</div></div>'+
    '<div class="entry-info"><span class="label">Markets:</span> '+marketStr+'</div>'+
    '</div></div>';
}

function renderStoreOpening(e){
  return '<div class="entry">'+
    '<div class="entry-preview">'+
    '<div class="title-row">'+
      '<div>'+
        '<div class="entry-title">'+esc(e.storeName||'')+'</div>'+
        '<div class="entry-date">'+(e.targetOpenDate?'Target '+fmtDDMMM(e.targetOpenDate):'')+'</div>'+
      '</div>'+
      liveBadge()+
    '</div>'+
    '<div class="entry-info"><span class="label">Market:</span> '+esc(e.market||'—')+'</div>'+
    '<div class="entry-info"><span class="label">Store Size:</span> '+esc(e.storeSize||'—')+'</div>'+
    '</div></div>';
}

function renderEvent(e){
  return '<div class="entry">'+
    '<div class="entry-preview">'+
    '<div class="title-row">'+
      '<div>'+
        '<div class="entry-title">'+esc(e.title||'')+'</div>'+
        '<div class="entry-date">'+(e.startDate||'')+(e.endDate?' to '+e.endDate:'')+'</div>'+
      '</div>'+
      liveBadge()+
    '</div>'+
    '<div class="entry-info"><span class="label">Markets:</span> '+(e.allMarkets?'All':esc((e.markets||[]).join(', ')||'—'))+'</div>'+
    (e.notes?'<div class="entry-info">'+esc(e.notes)+'</div>':'')+
    '</div></div>';
}

function renderEntry(row){
  var e   = row.entry_data||{};
  var sec = row.section||'global';
  if(sec==='global')         return renderGlobal(e);
  if(sec==='china'||sec==='sea'||sec==='nea') return renderRegional(e);
  if(sec==='restocks')       return renderRestock(e);
  if(sec==='store_openings') return renderStoreOpening(e);
  if(sec==='events')         return renderEvent(e);
  return renderGlobal(e);
}

// ── Main render ───────────────────────────────────────────────────────────────

function setYear(yr){
  _year = yr;
  document.getElementById('yr2026').classList.toggle('active', yr===2026);
  document.getElementById('yr2027').classList.toggle('active', yr===2027);
  loadCalendar();
}

function loadCalendar(){
  var tbl = document.getElementById('calTable');
  if(!_sb){
    tbl.innerHTML = '<tbody><tr><td class="msg-cell">Waiting for connection&hellip;</td></tr></tbody>';
    return;
  }
  tbl.innerHTML = '<tbody><tr><td class="msg-cell">Loading&hellip;</td></tr></tbody>';

  _sb.from('public_calendar_entries')
    .select('*')
    .eq('year', _year)
    .then(function(res){
      if(res.error){
        tbl.innerHTML = '<tbody><tr><td class="msg-cell" style="color:#c00">Error: '+esc(res.error.message)+'</td></tr></tbody>';
        return;
      }
      var rows = res.data||[];

      // Group: section → week_id → rows[]
      var bySecWeek = {};
      SECTIONS.forEach(function(s){ bySecWeek[s.key]={}; });
      rows.forEach(function(row){
        var sec = row.section||'global';
        var wid = row.week_id;
        if(!bySecWeek[sec]) bySecWeek[sec]={};
        if(!bySecWeek[sec][wid]) bySecWeek[sec][wid]=[];
        bySecWeek[sec][wid].push(row);
      });

      var weeks = buildWeeks(_year);

      // Build quarter/month spanning header
      var quarterRuns=[], monthRuns=[];
      weeks.forEach(function(w){
        var q = quarterRuns[quarterRuns.length-1];
        if(!q||q.label!==w.quarter) quarterRuns.push({label:w.quarter,count:1});
        else q.count++;
        var m = monthRuns[monthRuns.length-1];
        if(!m||m.label!==w.month) monthRuns.push({label:w.month,count:1});
        else m.count++;
      });

      var html = '<thead>';
      html += '<tr><th class="corner">Quarter</th>'+
        quarterRuns.map(function(r){
          return '<th colspan="'+r.count+'">'+r.label.replace('Q','Quarter ')+'</th>';
        }).join('')+'</tr>';
      html += '<tr><th class="corner">Month</th>'+
        monthRuns.map(function(r){
          return '<th colspan="'+r.count+'">'+r.label+' '+_year+'</th>';
        }).join('')+'</tr>';
      html += '<tr><th class="corner">Week</th>'+
        weeks.map(function(w,i){
          return '<th class="wk '+(i%2?'alt':'')+'">Wk '+w.weekOfYear+'</th>';
        }).join('')+'</tr>';
      html += '<tr><th class="corner">Date</th>'+
        weeks.map(function(w,i){
          return '<th class="wk '+(i%2?'alt':'')+'">'+weekRangeLabel(w.start,w.end)+'</th>';
        }).join('')+'</tr>';
      html += '</thead><tbody>';

      // Section rows
      SECTIONS.forEach(function(sec){
        var secData = bySecWeek[sec.key]||{};
        html += '<tr><th class="rowhead '+sec.cls+'">'+esc(sec.label)+'</th>';
        weeks.forEach(function(w,i){
          var cellRows = secData[w.id]||[];
          html += '<td class="wk '+(i%2?'alt':'')+'"><div class="cell">';
          cellRows.forEach(function(row){ html += renderEntry(row); });
          html += '</div></td>';
        });
        html += '</tr>';
      });

      html += '</tbody>';
      tbl.innerHTML = html;
    });
}

// ── Auth bridge (called by parent index.html) ─────────────────────────────────

function btvSyncStart(session, parentSb){
  if(parentSb){ _sb = parentSb; window._btvSb = parentSb; }
  if(!_loaded){ _loaded = true; loadCalendar(); }
}

window.plannerUnlockWith = function(){};
window.btvSyncStart  = btvSyncStart;
window.setYear       = setYear;
window.loadCalendar  = loadCalendar;
</script>
</body>
</html>
