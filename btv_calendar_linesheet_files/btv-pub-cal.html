<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTV Calendar</title>
<style>

/* ── Variables (identical to management calendar) ─────────────────────────── */
:root{
  --bg:#f7f6f4;
  --panel:#ffffff;
  --grid:#d6d2cc;
  --text:#111111;
  --muted:#787470;
  --global:#d4d4d4;
  --nea:#4a8eb5;
  --sea:#c43030;
  --china:#c47800;
  --restocks:#7a5a35;
  --events:#edecea;
  --wkA:#ffffff;
  --wkB:#f3f2f0;
  --btn:#f0efed;
  --delay:#DB6256;
  --delay-border:#b03020;
}

/* ── BTV Brand Aesthetic (same as management calendar) ───────────────────── */
*, *::before, *::after { box-sizing:border-box; border-radius:0 !important; }
body, button, input, select, textarea {
  font-family:'Everett','Helvetica Neue',Helvetica,Arial,sans-serif;
}

html, body { height:100%; overflow:hidden; margin:0; }
body {
  background:var(--bg);
  color:var(--text);
  font-size:13px;
  display:flex;
  flex-direction:column;
}

.app { display:flex; flex-direction:column; height:100%; overflow:hidden; }

/* ── Toolbar ─────────────────────────────────────────────────────────────── */
.toolbar {
  flex-shrink:0;
  position:sticky; top:0; z-index:20;
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  background:rgba(247,246,244,.97);
  backdrop-filter:blur(8px);
  border:1px solid var(--grid);
  border-radius:0 !important;
  padding:10px 14px;
  margin:10px 12px 8px;
}
.toolbar-title {
  font-size:14px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:#3a3530;
}
.view-only-badge {
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  background:#f0ede7; border:1px solid #c5bfb5; color:#787470;
  padding:3px 9px;
}
.yr-tabs { display:flex; gap:4px; margin-left:auto; }
.yr-tab {
  padding:4px 14px; border:1px solid var(--grid);
  font-family:inherit; font-size:12px; font-weight:700;
  background:#fff; color:#888; cursor:pointer; letter-spacing:.04em;
  transition:background .12s,color .12s,border-color .12s;
}
.yr-tab.active  { background:#3a3530; color:#fff; border-color:#3a3530; }
.yr-tab:hover:not(.active) { background:#f4f2ef; }
.refresh-btn {
  padding:4px 12px; border:1px solid var(--grid);
  font-family:inherit; font-size:12px; font-weight:600;
  background:var(--btn); color:#555; cursor:pointer;
}
.refresh-btn:hover { background:#e8e7e5; }

/* ── Table container ─────────────────────────────────────────────────────── */
.table-outer {
  flex:1; min-height:0; overflow:auto;
  margin:0 12px 12px;
  border:1px solid var(--grid);
  background:var(--panel);
}
table {
  border-collapse:separate; border-spacing:0;
  min-width:100%; width:max-content;
}
th, td {
  border-right:1px solid var(--grid);
  border-bottom:1px solid var(--grid);
  vertical-align:top;
}
thead th {
  background:#eceae7;
  text-align:center; padding:8px 6px; font-weight:600;
  position:sticky; z-index:4;
}
thead tr:nth-child(1) th { top:0; }
thead tr:nth-child(2) th { top:36px; }
thead tr:nth-child(3) th { top:72px; }
thead tr:nth-child(4) th { top:108px; }

.corner {
  position:sticky; left:0; z-index:6;
  background:#eceae7; text-align:left;
  width:138px; min-width:138px; max-width:138px;
  padding:8px 10px; white-space:nowrap;
}
thead .corner { z-index:8; }

.rowhead {
  position:sticky; left:0; z-index:5;
  width:138px; min-width:138px; max-width:138px;
  padding:12px; font-weight:600;
  white-space:normal; word-break:break-word;
  text-align:left; font-size:18px; line-height:1.15; color:#fff;
}
.bg-global  { background:var(--global); color:#2d2d2d; }
.bg-nea     { background:var(--nea); }
.bg-sea     { background:var(--sea); }
.bg-china   { background:var(--china); }
.bg-restocks{ background:var(--restocks); }
.bg-events  { background:var(--events); color:#2d2d2d; }

.wk     { width:255px; min-width:255px; padding:6px; text-align:center; background:var(--wkA); }
.wk.alt { background:var(--wkB); }

.cell {
  min-height:180px; display:flex; flex-direction:column;
  gap:8px; align-items:stretch;
}

/* ── Entry card ──────────────────────────────────────────────────────────── */
.entry {
  background:#ffffff; border:1px solid var(--grid);
  padding:12px; text-align:left; position:relative;
  cursor:pointer;
  transition:box-shadow .15s, transform .15s;
}
.entry:hover {
  z-index:15; box-shadow:0 8px 24px rgba(0,0,0,.12); transform:translateY(-1px);
}
.entry.delay { background:var(--delay); border-color:var(--delay-border); }
.entry.delay .entry-title,.entry.delay .entry-date,.entry.delay .cat,
.entry.delay .prod-name,.entry.delay .prod-price,.entry.delay .prod-meta,
.entry.delay .label,.entry.delay .muted { color:#111 !important; }

.entry-preview { max-height:150px; overflow:hidden; }
.entry:hover .entry-preview { max-height:none; overflow:visible; }

.title-row {
  display:flex; gap:8px; align-items:flex-start;
  justify-content:space-between; margin-bottom:4px;
}
.title-left {
  display:flex; gap:10px; align-items:flex-start; min-width:0;
}
.dot {
  width:14px; height:14px; border:1px solid rgba(0,0,0,.15);
  margin-top:6px; flex:0 0 auto;
}
.dot.high   { background:#c92323; }
.dot.medium { background:#f2a114; }
.dot.low    { background:#f2d148; }
.dot.brand  { background:#f2d148; }

.entry-title {
  font-weight:600; line-height:1.15; font-size:13px;
  white-space:normal; word-break:break-word; overflow:hidden;
}
.entry-date {
  font-size:13px; color:var(--muted); font-weight:600;
  margin-bottom:4px; line-height:1.05;
}

.live-badge {
  display:inline-block; flex-shrink:0; margin-top:2px;
  font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
  background:#2a6e2a; color:#fff; padding:2px 8px; white-space:nowrap;
}

.group { display:grid; grid-template-columns:64px 1fr; gap:12px; margin-top:10px; }
.cat   { font-weight:600; font-size:10px; }

.prod          { margin-bottom:10px; }
.prod-top      { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.prod-name     { font-weight:600; min-width:0; flex:1 1 auto; line-height:1.15; font-size:12px; white-space:normal; word-break:break-word; overflow:hidden; }
.prod-price    { white-space:nowrap; font-weight:600; flex:0 0 auto; font-size:12px; }
.prod-meta     { white-space:pre-line; margin-top:2px; line-height:1.08; font-size:12px; }

.label      { font-weight:600; font-size:12px; }
.muted      { color:var(--muted); }
.entry-info { font-size:12px; margin-top:4px; line-height:1.3; }
.launch-status { margin-top:12px; padding-top:8px; font-size:12px; line-height:1.08; }

/* ── Category colour coding (same as management calendar) ─────────────────── */
.entry.cat-bags {
  border-color:#7f5a3a !important;
  box-shadow:inset 0 0 0 1px rgba(127,90,58,.2);
  color:#7f5a3a;
}
.entry.cat-mrtw,.entry.cat-wrtw,.entry.cat-krtw {
  border-color:#6fa8c2 !important;
  box-shadow:inset 0 0 0 1px rgba(111,168,194,.2);
  color:#2f7ea0;
}
.entry.cat-acc,.entry.cat-eyewear,.entry.cat-footwear,.entry.cat-lf,.entry.cat-pets {
  border-color:#7f7f7f !important;
  box-shadow:inset 0 0 0 1px rgba(127,127,127,.2);
  color:#676767;
}
.entry.cat-bags,
.entry.cat-mrtw,.entry.cat-wrtw,.entry.cat-krtw,
.entry.cat-acc,.entry.cat-eyewear,.entry.cat-footwear,.entry.cat-lf,.entry.cat-pets {
  border-width:3px !important;
}
.entry.cat-bags::before,
.entry.cat-mrtw::before,.entry.cat-wrtw::before,.entry.cat-krtw::before,
.entry.cat-acc::before,.entry.cat-eyewear::before,.entry.cat-footwear::before,
.entry.cat-lf::before,.entry.cat-pets::before {
  content:""; position:absolute; left:0; top:0; right:0; height:6px;
  background:currentColor; opacity:.95;
}
.entry.cat-bags .entry-title,.entry.cat-bags .entry-date,
.entry.cat-mrtw .entry-title,.entry.cat-mrtw .entry-date,
.entry.cat-wrtw .entry-title,.entry.cat-wrtw .entry-date,
.entry.cat-krtw .entry-title,.entry.cat-krtw .entry-date,
.entry.cat-acc .entry-title,.entry.cat-acc .entry-date,
.entry.cat-eyewear .entry-title,.entry.cat-eyewear .entry-date,
.entry.cat-footwear .entry-title,.entry.cat-footwear .entry-date,
.entry.cat-lf .entry-title,.entry.cat-lf .entry-date,
.entry.cat-pets .entry-title,.entry.cat-pets .entry-date { color:inherit; }

/* ── Markdown row (matches management calendar exactly) ──────────────────── */
.markdown-span-cell {
  padding:0 !important; background:transparent !important;
  vertical-align:top !important; position:relative !important;
}
.markdown-track { min-height:44px; position:relative; }
.markdown-bubble-span {
  position:relative; margin:2px 6px; min-height:38px;
  border:1.5px solid #d8b231; border-radius:10px;
  background:#f5df73; padding:4px 8px; font-size:10px; line-height:1.3;
  word-break:break-word;
}
.markdown-bubble-span.md-start { border-radius:999px 0 0 999px; margin-right:0; padding-right:2px; border-right:none; }
.markdown-bubble-span.md-mid   { border-radius:0; margin:2px 0; padding:0 4px; border-left:none; border-right:none; }
.markdown-bubble-span.md-end   { border-radius:0 999px 999px 0; margin-left:0; padding-left:4px; border-left:none; }
.markdown-title { font-weight:700; }
.markdown-rowhead { font-size:12px !important; line-height:1.2 !important; }

/* ── Status / empty ─────────────────────────────────────────────────────── */
.msg-cell { padding:40px 20px; text-align:center; color:#aaa; font-size:13px; }

/* ── Entry detail popup ──────────────────────────────────────────────────── */
.popup-backdrop {
  display:none; position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,.38); align-items:flex-start;
  justify-content:center; padding:18px; overflow:auto;
}
.popup-backdrop.show { display:flex; }
.popup-card {
  width:min(720px,100%); background:#fbf8f1;
  border:1px solid var(--grid); padding:0; margin:auto;
  box-shadow:0 12px 48px rgba(0,0,0,.18);
  position:relative;
}
.popup-header {
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:12px; padding:16px 20px 12px; border-bottom:1px solid var(--grid);
  background:#f0ede7;
}
.popup-title  { font-size:18px; font-weight:700; letter-spacing:.01em; color:#111; line-height:1.2; }
.popup-meta   { font-size:12px; color:var(--muted); margin-top:4px; }
.popup-close  {
  flex-shrink:0; padding:4px 10px; border:1px solid #c8c5c0;
  background:#fff; color:#555; font-size:18px; line-height:1;
  cursor:pointer; align-self:flex-start;
}
.popup-close:hover { background:#e8e7e5; }
.popup-body   { padding:16px 20px; }
.popup-section-hd {
  font-size:10px; font-weight:800; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted);
  margin:14px 0 6px; padding-bottom:4px;
  border-bottom:1px solid var(--grid);
}
.popup-section-hd:first-child { margin-top:0; }
.popup-table {
  width:100%; border-collapse:collapse; font-size:12px;
}
.popup-table th {
  text-align:left; font-size:10px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); padding:5px 8px;
  border-bottom:1px solid var(--grid);
  background:#f5f3ef;
}
.popup-table td {
  padding:6px 8px; border-bottom:1px solid #ede9e3;
  vertical-align:top; line-height:1.35;
}
.popup-table tr:last-child td { border-bottom:none; }
.popup-cat-row td { font-weight:700; background:#f5f3ef; color:#555; font-size:10px; letter-spacing:.05em; text-transform:uppercase; }
.popup-table td img { border:1px solid #e0dbd4; background:#f7f6f4; }
.popup-footer {
  padding:10px 20px; border-top:1px solid var(--grid);
  font-size:12px; color:var(--muted); background:#f5f3ef;
  display:flex; justify-content:space-between; align-items:center;
}
.popup-sku-count { font-weight:700; color:#111; }
.popup-info-row  { display:grid; grid-template-columns:140px 1fr; gap:4px 12px; margin-bottom:6px; }
.popup-lbl       { font-weight:600; font-size:12px; }
.popup-val       { font-size:12px; color:#333; }

</style>
</head>
<body>

<div class="app">

  <div class="toolbar">
    <span class="toolbar-title">BTV Calendar</span>
    <span class="view-only-badge">View Only</span>
    <div class="yr-tabs">
      <button class="yr-tab active" id="yr2026" onclick="setYear(2026)">2026</button>
      <button class="yr-tab"        id="yr2027" onclick="setYear(2027)">2027</button>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadCalendar()">&#8635; Refresh</button>
  </div>

  <div class="table-outer">
    <table id="calTable">
      <tbody><tr><td class="msg-cell">Loading&hellip;</td></tr></tbody>
    </table>
  </div>

</div>

<!-- Entry detail popup -->
<div class="popup-backdrop" id="entryPopup" onclick="handleBackdropClick(event)">
  <div class="popup-card" id="entryPopupCard">
    <div class="popup-header">
      <div>
        <div class="popup-title" id="popupTitle"></div>
        <div class="popup-meta"  id="popupMeta"></div>
      </div>
      <button class="popup-close" onclick="closePopup()">&#x2715;</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
    <div class="popup-footer">
      <span id="popupSection" style="font-weight:600"></span>
      <span class="popup-sku-count" id="popupSkuCount"></span>
    </div>
  </div>
</div>

<script>
var _year    = 2026;
var _sb      = null;
var _loaded  = false;
var _entryMap = {};     // entry_id → row (for popup)
var _lsMap   = {};      // productName.toLowerCase() → {hscode, productImg, workflowStatus, selectedForLinesheet}
var _rtChannel = null;  // realtime channel
var _debounceTimer = null;

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

var SECTIONS = [
  {key:'global',         label:'Global',               cls:'bg-global'},
  {key:'china',          label:'China',                cls:'bg-china'},
  {key:'sea',            label:'SEA',                  cls:'bg-sea'},
  {key:'nea',            label:'NEA',                  cls:'bg-nea'},
  {key:'restocks',       label:'Restocks',             cls:'bg-restocks'},
  {key:'events',         label:'Events / Activations', cls:'bg-events'},
  {key:'store_openings', label:'Store Openings',       cls:'bg-global'},
];

var SECTION_LABELS = {};
SECTIONS.forEach(function(s){ SECTION_LABELS[s.key] = s.label; });

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDDMMM(v){
  if(!v) return '';
  var d = new Date(v+'T00:00:00');
  if(isNaN(d.getTime())) return String(v);
  return String(d.getDate()).padStart(2,'0')+'-'+MONTHS[d.getMonth()];
}
function dayName(v){
  if(!v) return '';
  var d = new Date(v+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-US',{weekday:'short'});
}
function weekRangeLabel(a,b){
  return String(a.getDate()).padStart(2,'0')+'-'+MONTHS[a.getMonth()]+
    ' to '+String(b.getDate()).padStart(2,'0')+'-'+MONTHS[b.getMonth()];
}
function mondayOnOrBefore(date){
  var d = new Date(date); var day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d;
}
function addDays(date,n){
  var d = new Date(date); d.setDate(d.getDate()+n); return d;
}
function buildWeeks(yr){
  var start = new Date(yr+'-01-01T00:00:00');
  var end   = new Date(yr+'-12-31T00:00:00');
  var cur   = mondayOnOrBefore(start);
  var out   = [];
  while(cur <= end){
    var wkEnd  = addDays(cur,6);
    var anchor = addDays(cur,3);
    if(wkEnd>=start && cur<=end){
      out.push({
        id:    cur.toISOString().slice(0,10),
        start: new Date(cur), end: new Date(wkEnd),
        month: MONTHS[anchor.getMonth()],
        quarter:'Q'+(Math.floor(anchor.getMonth()/3)+1)
      });
    }
    cur = addDays(cur,7);
  }
  out.forEach(function(w,i){ w.weekOfYear=i+1; });
  return out;
}
function weekIdsInRange(startISO, endISO, weeks){
  var a = new Date(startISO+'T00:00:00');
  var b = new Date(endISO+'T00:00:00');
  if(isNaN(a.getTime())||isNaN(b.getTime())) return [];
  return weeks.filter(function(w){ return !(w.end<a||w.start>b); }).map(function(w){ return w.id; });
}
function dotCls(entry){
  var k = entry.keyLevel||'brand';
  return {high:'high',medium:'medium',low:'low',brand:'brand'}[k]||'brand';
}
function globalCategoryClass(entry){
  var firstCat = ((entry.lines||[]).find(function(x){return x.category;})||{}).category||'';
  return firstCat ? 'cat-'+firstCat.toLowerCase() : '';
}
function liveBadge(){ return '<span class="live-badge">&#10003; Live</span>'; }

function countItems(str){
  return String(str||'').split(/[,;]/).map(function(s){return s.trim();}).filter(Boolean).length;
}
function countLineSkus(l){ return countItems(l && l.colour); }
function countEntrySkus(e){
  var total = 0;
  (e.lines||[]).forEach(function(l){ total += countLineSkus(l); });
  return total;
}

// ── Entry card renderers ──────────────────────────────────────────────────────

function renderGlobal(e, entryId){
  var grouped = {};
  (e.lines||[]).forEach(function(l){
    if(!(l.category||l.productName||l.colour||l.size||l.price)) return;
    var c = l.category||''; if(!grouped[c]) grouped[c]=[]; grouped[c].push(l);
  });
  var groups = Object.keys(grouped).map(function(cat){
    return '<div class="group"><div class="cat">'+esc(cat)+'</div><div>'+
      grouped[cat].map(function(l){
        return '<div class="prod"><div class="prod-top">'+
          '<div class="prod-name">'+esc(l.productName||'')+'</div>'+
          '<div class="prod-price">'+(l.price?'$'+esc(l.price):'')+'</div>'+
          '</div><div class="prod-meta">'+esc(l.colour||'')+'</div></div>';
      }).join('')+'</div></div>';
  }).join('');
  var mkts = (e.noLaunchMarkets||[]).length ? esc((e.noLaunchMarkets).join(', ')) : '—';
  var catCls = globalCategoryClass(e);
  var hasCat = catCls ? ' style="padding-top:18px"' : '';
  return '<div class="entry'+(e.launchStatus==='delay'?' delay':'')+(catCls?' '+catCls:'')+'"'+
    ' onclick="openPopup(\''+esc(entryId)+'\')" title="Click for details">'+
    '<div class="entry-preview"'+hasCat+'>'+
    '<div class="title-row">'+
      '<div class="title-left"><div class="dot '+dotCls(e)+'"></div>'+
        '<div><div class="entry-date">'+fmtDDMMM(e.launchDate)+(e.launchDate?' ('+dayName(e.launchDate)+')':'')+'</div>'+
        '<div class="entry-title">'+esc(e.launchTitle||'')+'</div></div></div>'+
      liveBadge()+
    '</div>'+groups+
    '<div class="entry-info"><span class="label">SKUs:</span> '+(countEntrySkus(e)||Number(e.skuCount||0))+'</div>'+
    '<div class="entry-info"><span class="label">Mkt:</span> '+mkts+'</div>'+
    '</div></div>';
}

function renderRegional(e, entryId){
  var displayDate = e.launchDate||e.startDateISO||'';
  var dateStr = displayDate ? fmtDDMMM(displayDate)+' ('+dayName(displayDate)+')' : (e.startDate||'');
  var displayTitle = e.launchTitle||e.optionType||'';
  var marketStr = (e.allMarkets||false)?'All':esc((e.countries||[]).join(', ')||'—');
  var colour = e.colour||(e.colorSize&&!e.colorSize.includes(' / ')?e.colorSize:(e.colorSize||'').split(' / ')[0])||'';
  return '<div class="entry" onclick="openPopup(\''+esc(entryId)+'\')" title="Click for details">'+
    '<div class="entry-preview">'+
    '<div class="title-row">'+
      '<div class="title-left"><div class="dot '+dotCls(e)+'"></div>'+
        '<div><div class="entry-date">'+dateStr+'</div>'+
        '<div class="entry-title">'+esc(displayTitle)+'</div></div></div>'+
      liveBadge()+
    '</div>'+
    '<div class="group"><div class="cat">'+esc(e.optionType||'')+'</div>'+
    '<div><div class="prod"><div class="prod-top">'+
      '<div class="prod-name">'+esc(e.productTitle||'—')+'</div>'+
      '<div class="prod-price">'+(e.price?'$'+esc(e.price):'')+'</div>'+
    '</div><div class="prod-meta">'+esc(colour)+'</div></div></div></div>'+
    '<div class="entry-info"><span class="label">Mkts:</span> '+marketStr+'</div>'+
    '</div></div>';
}

function renderRestock(e, entryId){
  var displayDate = e.etaISO||'';
  var dateStr = displayDate ? 'ETA '+fmtDDMMM(displayDate)+' ('+dayName(displayDate)+')' : (e.eta?'ETA '+e.eta:'');
  var lines = (e.lines&&e.lines.length)?e.lines:[{productTitle:e.productTitle||'',colour:'',colors:e.colors||''}];
  var displayTitle = lines.length>1
    ? lines.map(function(l){return l.productTitle;}).filter(Boolean).join(', ')
    : (lines[0].productTitle||e.productTitle||'');
  var marketStr = (e.allMarkets||false)?'All Markets':esc((e.markets||[]).join(', ')||'—');
  var lineHTML = lines.filter(function(l){return l.productTitle||l.colour||l.colors;}).map(function(l){
    var col = l.colour||(l.colors&&!l.colors.includes(' / ')?l.colors:(l.colors||'').split(' / ')[0])||'';
    return '<div class="prod"><div class="prod-top"><div class="prod-name">'+esc(l.productTitle||'—')+'</div></div>'+
      '<div class="prod-meta">'+esc(col)+'</div></div>';
  }).join('');
  return '<div class="entry" onclick="openPopup(\''+esc(entryId)+'\')" title="Click for details">'+
    '<div class="entry-preview">'+
    '<div class="title-row">'+
      '<div class="title-left"><div class="dot '+dotCls(e)+'"></div>'+
        '<div><div class="entry-date">'+dateStr+'</div>'+
        '<div class="entry-title">'+esc(displayTitle)+'</div></div></div>'+
      liveBadge()+
    '</div>'+
    '<div class="group"><div class="cat">Restock</div><div>'+lineHTML+'</div></div>'+
    '<div class="entry-info"><span class="label">Mkts:</span> '+marketStr+'</div>'+
    '</div></div>';
}

function renderEntry(row){
  var e   = row.entry_data||{};
  var sec = row.section||'global';
  var id  = row.entry_id||row.id||'';
  _entryMap[id] = row;
  if(sec==='global')         return renderGlobal(e, id);
  if(sec==='china'||sec==='sea'||sec==='nea') return renderRegional(e, id);
  if(sec==='restocks')       return renderRestock(e, id);
  if(sec==='store_openings') return renderStoreOpening(e, id);
  if(sec==='events')         return renderEvent(e, id);
  return renderGlobal(e, id);
}

function _lsStatusBadge(ls){
  if(!ls) return '<span style="color:#aaa;font-size:11px">—</span>';
  if(ls.selectedForLinesheet && ls.workflowStatus==='approved')
    return '<span style="background:#2a6e2a;color:#fff;font-size:10px;padding:2px 6px;font-weight:700">Approved</span>';
  if(ls.workflowStatus==='published')
    return '<span style="background:#4a8eb5;color:#fff;font-size:10px;padding:2px 6px;font-weight:700">Published</span>';
  if(ls.selectedForLinesheet)
    return '<span style="background:#f5c842;color:#333;font-size:10px;padding:2px 6px;font-weight:700">Selected</span>';
  return '<span style="background:#e0dbd4;color:#555;font-size:10px;padding:2px 6px;font-weight:700">Draft</span>';
}

function _debouncedReload(){
  clearTimeout(_debounceTimer);

}

function loadCalendar(){
  if(!_sb) return;
  _entryMap = {};
  _lsMap = {};
  var tbl = document.getElementById('calTable');
  tbl.innerHTML = '<tbody><tr><td class="msg-cell">Loading&hellip;</td></tr></tbody>';

  // Fetch entries, markdowns AND linesheet products in parallel
  var entriesPromise = _sb.from('public_calendar_entries').select('*').eq('year', _year);
  var mdKey = 'calendar-'+_year+'-markdown-bars-v1';
  var mdPromise = _sb.from('app_state').select('value').eq('key', mdKey).maybeSingle();
  var lsPromise = _sb.from('app_state').select('value').eq('key', 'btv_linesheet_products').maybeSingle();

  Promise.all([entriesPromise, mdPromise, lsPromise]).then(function(results){
    var entriesRes = results[0];
    var mdRes      = results[1];
    var lsRes      = results[2];

    // Build linesheet product lookup map (name → {hscode, productImg, workflowStatus, selectedForLinesheet})
    _lsMap = {};
    try {
      var lsProducts = (lsRes && lsRes.data && lsRes.data.value) ? lsRes.data.value : [];
      if(Array.isArray(lsProducts)){
        lsProducts.forEach(function(p){
          var key = (p.name||'').toLowerCase();
          if(key && !_lsMap[key]){
            _lsMap[key] = {
              hscode: p.hscode||p.hscode10||'',
              productImg: p.productImg||p.lookbookImg||'',
              workflowStatus: p.workflowStatus||'draft',
              selectedForLinesheet: !!p.selectedForLinesheet
            };
          } else if(key && _lsMap[key]){
            // Prefer approved over draft; prefer entries with images
            if(!_lsMap[key].productImg && (p.productImg||p.lookbookImg))
              _lsMap[key].productImg = p.productImg||p.lookbookImg||'';
            if(!_lsMap[key].hscode && (p.hscode||p.hscode10))
              _lsMap[key].hscode = p.hscode||p.hscode10||'';
          }
        });
      }
    } catch(ex){ console.warn('[BTV] linesheet map build error', ex); }

    if(entriesRes.error){
      tbl.innerHTML = '<tbody><tr><td class="msg-cell" style="color:#c00">Error: '+esc(entriesRes.error.message)+'</td></tr></tbody>';
      return;
    }

    var rows       = entriesRes.data||[];
    var mdState    = (mdRes.data && mdRes.data.value) ? mdRes.data.value : {};

    // Group entries: section → week_id → rows[]
    var bySecWeek = {};
    SECTIONS.forEach(function(s){ bySecWeek[s.key]={}; });
    rows.forEach(function(row){
      var sec = row.section||'global';
      var wid = row.week_id;
      if(!bySecWeek[sec]) bySecWeek[sec]={};
      if(!bySecWeek[sec][wid]) bySecWeek[sec][wid]=[];
      bySecWeek[sec][wid].push(row);
    });

    var weeks = buildWeeks(_year);
    var visibleIds = weeks.map(function(w){ return w.id; });

    // Build spanning markdown lane data (same algorithm as management calendar)
    // Only show markdowns that have been published to BTV Calendar
    var _trackH = 44;
    var allMds  = Object.values(mdState||{}).filter(function(md){ return md&&md.startDate&&md.endDate&&md.publishedToCal; });
    // which weeks each markdown spans (in visible set)
    var mdWeeks = allMds.map(function(md){
      return weekIdsInRange(md.startDate, md.endDate, weeks).filter(function(id){ return visibleIds.indexOf(id)>=0; });
    });
    // week → set of md indices
    var mdWeekIdx = {};
    weeks.forEach(function(w){ mdWeekIdx[w.id]=new Set(); });
    allMds.forEach(function(md, idx){
      mdWeeks[idx].forEach(function(wid){ if(mdWeekIdx[wid]) mdWeekIdx[wid].add(idx); });
    });
    // lane assignment
    var laneOf = allMds.map(function(md, idx){
      var covWeeks = mdWeeks[idx].filter(function(id){ return mdWeekIdx[id]!==undefined; });
      var maxAbove = 0;
      covWeeks.forEach(function(wid){
        var above = 0;
        for(var j=0;j<idx;j++){ if(mdWeekIdx[wid]&&mdWeekIdx[wid].has(j)) above++; }
        if(above>maxAbove) maxAbove=above;
      });
      return maxAbove;
    });
    var maxLane  = laneOf.length ? Math.max.apply(null,laneOf) : 0;
    var cellH    = (maxLane+1)*_trackH;
    var hasMds   = allMds.length > 0;

    // Build quarter/month header spans
    var quarterRuns=[], monthRuns=[];
    weeks.forEach(function(w){
      var q = quarterRuns[quarterRuns.length-1];
      if(!q||q.label!==w.quarter) quarterRuns.push({label:w.quarter,count:1}); else q.count++;
      var m = monthRuns[monthRuns.length-1];
      if(!m||m.label!==w.month) monthRuns.push({label:w.month,count:1}); else m.count++;
    });

    var html = '<thead>';
    html += '<tr><th class="corner">Quarter</th>'+
      quarterRuns.map(function(r){ return '<th colspan="'+r.count+'">'+r.label.replace('Q','Quarter ')+'</th>'; }).join('')+'</tr>';
    html += '<tr><th class="corner">Month</th>'+
      monthRuns.map(function(r){ return '<th colspan="'+r.count+'">'+r.label+' '+_year+'</th>'; }).join('')+'</tr>';
    html += '<tr><th class="corner">Week</th>'+
      weeks.map(function(w,i){ return '<th class="wk '+(i%2?'alt':'')+'">Wk '+w.weekOfYear+'</th>'; }).join('')+'</tr>';
    html += '<tr><th class="corner">Date</th>'+
      weeks.map(function(w,i){ return '<th class="wk '+(i%2?'alt':'')+'">'+weekRangeLabel(w.start,w.end)+'</th>'; }).join('')+'</tr>';
    html += '</thead><tbody>';

    // ── Markdown row ──────────────────────────────────────────────────────────
    html += '<tr><th class="rowhead bg-global markdown-rowhead" style="font-size:12px;line-height:1.2">Markdown</th>';
    weeks.forEach(function(w, i){
      if(!hasMds){
        html += '<td class="wk '+(i%2?'alt':'')+'"><div class="cell" style="min-height:'+_trackH+'px"></div></td>';
      } else {
        html += '<td class="wk '+(i%2?'alt':'')+' markdown-span-cell" style="height:'+cellH+'px">';
        allMds.forEach(function(md, idx){
          if(mdWeekIdx[w.id]&&mdWeekIdx[w.id].has(idx)){
            var cov    = mdWeeks[idx];
            var isStart = cov[0]===w.id;
            var isEnd   = cov[cov.length-1]===w.id;
            var spanCls = (isStart&&isEnd)?'':(isStart?'md-start':(isEnd?'md-end':'md-mid'));
            var topPx   = laneOf[idx]*_trackH;
            html += '<div class="markdown-track" style="position:absolute;top:'+topPx+'px;left:0;right:0">'+
              '<div class="markdown-bubble-span '+spanCls+'">';
            if(isStart){
              html += '<div class="markdown-title">'+esc(md.title||'')+'</div>'+
                '<div>'+fmtDDMMM(md.startDate)+'&rarr;'+fmtDDMMM(md.endDate)+'</div>';
            }
            html += '</div></div>';
          }
        });
        html += '</td>';
      }
    });
    html += '</tr>';

    // ── Section rows ──────────────────────────────────────────────────────────
    SECTIONS.forEach(function(sec){
      var secData = bySecWeek[sec.key]||{};
      html += '<tr><th class="rowhead '+sec.cls+'">'+esc(sec.label)+'</th>';
      weeks.forEach(function(w,i){
        var cellRows = secData[w.id]||[];
        html += '<td class="wk '+(i%2?'alt':'')+'"><div class="cell">';
        cellRows.forEach(function(row){ html += renderEntry(row); });
        html += '</div></td>';
      });
      html += '</tr>';
    });

    html += '</tbody>';
    tbl.innerHTML = html;
  });
}

// ── Supabase realtime (auto-refresh) ─────────────────────────────────────────

function _setupRealtime(){
  if(!_sb) return;
  // Tear down existing subscription
  if(_rtChannel){ _sb.removeChannel(_rtChannel); _rtChannel=null; }

  _rtChannel = _sb.channel('btv-pub-cal-rt-v2')
    .on('postgres_changes',{event:'*',schema:'public',table:'public_calendar_entries'},
      function(){ _debouncedReload(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'app_state'},
      function(){ _debouncedReload(); })
    .subscribe();
}

// ── Auth bridge (called by parent index.html) ─────────────────────────────────

function btvSyncStart(session, parentSb){
  if(parentSb){ _sb = parentSb; window._btvSb = parentSb; }
  if(!_loaded){
    _loaded = true;
    loadCalendar();
    _setupRealtime();
  }
}

window.plannerUnlockWith = function(){};
window.btvSyncStart  = btvSyncStart;
window.setYear       = setYear;
window.loadCalendar  = loadCalendar;
window.openPopup     = openPopup;
window.closePopup    = closePopup;
</script>
